[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watt-forge"
version = "0.2.0"
description = "Power-converter design platform: first-principles loss models and a hybrid GaN buck-boost reference design (design and simulation reference only)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "nbformat>=5.9", "openpyxl>=3.1", "pillow>=10"]

[tool.setuptools]
packages = ["watt_forge", "watt_forge.flagship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
