<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 400" width="944" height="400" role="img" aria-label="Flagship controller state machine"><title>Flagship controller state machine</title>
<style>
  .bg{fill:#fcfcfb} .w{stroke:#52514e;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .c{stroke:#0b0b0b;stroke-width:2.2;fill:none;stroke-linecap:round} .fill{fill:#0b0b0b}
  .t{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0b0b0b}
  .s{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#52514e}
  .m{font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8a8984}
  .ax{stroke:#d8d7d2;stroke-width:1}
  .p1{stroke:#2a78d6} .p2{stroke:#eb6834} .p3{stroke:#1baf7a} .p4{stroke:#e87ba4}
  .cur{stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:4 14}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .wave{stroke-width:2;fill:none} .v{stroke:#2a78d6} .i{stroke:#eb6834}
  .cursor{stroke:#0b0b0b;stroke-width:1.2;opacity:.55}
  .box{fill:#f2f1ed;stroke:#d8d7d2} .hi{fill:#e5efff;stroke:#2a78d6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .w{stroke:#c3c2b7} .c{stroke:#ffffff} .fill{fill:#ffffff}
    .t{fill:#ffffff} .s{fill:#c3c2b7} .m{fill:#8f8e87} .ax{stroke:#3a3a37}
    .p1{stroke:#3987e5} .p2{stroke:#d95926} .p3{stroke:#199e70} .p4{stroke:#d55181}
    .v{stroke:#3987e5} .i{stroke:#d95926} .cursor{stroke:#ffffff}
    .box{fill:#262624;stroke:#3a3a37} .hi{fill:#1f2d44;stroke:#3987e5}
  }
</style>
<rect class="bg" width="944" height="400" rx="10"/><text class="t" x="20" y="28" text-anchor="start">Controller state machine (1 kHz supervisory tick; the reference C and Python are proven identical)</text><rect class="box" x="12" y="150" width="156" height="64" rx="10"/><text class="t" x="90" y="172" text-anchor="middle">INIT</text><text class="m" x="90" y="190" text-anchor="middle">wait: Vin > 13 V for 1 s</text><text class="m" x="90" y="204" text-anchor="middle">record Voc</text><rect class="box" x="196" y="150" width="156" height="64" rx="10"/><text class="t" x="274" y="172" text-anchor="middle">PRECHARGE</text><text class="m" x="274" y="190" text-anchor="middle">flying caps to Vbus/2</text><text class="m" x="274" y="204" text-anchor="middle">50 ms</text><rect class="box" x="380" y="150" width="156" height="64" rx="10"/><text class="t" x="458" y="172" text-anchor="middle">SWEEP</text><text class="m" x="458" y="190" text-anchor="middle">40-step global scan</text><text class="m" x="458" y="204" text-anchor="middle">0.95 Voc ... 0.45 Voc</text><rect class="hi" x="580" y="150" width="156" height="64" rx="10"/><text class="t" x="658" y="172" text-anchor="middle">TRACK</text><text class="m" x="658" y="190" text-anchor="middle">P&amp;O MPPT, adaptive step</text><text class="m" x="658" y="204" text-anchor="middle">mode select + CV limit</text><rect class="hi" x="772" y="150" width="156" height="64" rx="10"/><text class="t" x="850" y="172" text-anchor="middle">BYPASS</text><text class="m" x="850" y="190" text-anchor="middle">MPP within 2 % of Vbat</text><text class="m" x="850" y="204" text-anchor="middle">switching stops</text><rect class="box" x="380" y="280" width="156" height="64" rx="10"/><text class="t" x="458" y="302" text-anchor="middle">FAULT</text><text class="m" x="458" y="320" text-anchor="middle">OVP, battery out of range,</text><text class="m" x="458" y="334" text-anchor="middle">OCP, OTP: latched</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill"/></marker></defs><line class="w" x1="168" y1="182" x2="194" y2="182" marker-end="url(#ah)"/><line class="w" x1="352" y1="182" x2="378" y2="182" marker-end="url(#ah)"/><line class="w" x1="536" y1="182" x2="578" y2="182" marker-end="url(#ah)"/><text class="m" x="557.0" y="172.0" text-anchor="middle">best</text><line class="w" x1="736" y1="170" x2="770" y2="170" marker-end="url(#ah)"/><text class="m" x="753.0" y="162.0" text-anchor="middle">in band</text><line class="w" x1="770" y1="198" x2="738" y2="198" marker-end="url(#ah)"/><text class="m" x="754.0" y="216.0" text-anchor="middle">every 2 s</text><path class="w" d="M658,150 C658,95 458,95 458,148" marker-end="url(#ah)"/><text class="m" x="550" y="88" text-anchor="middle">power drops 30 % or every 5 min: re-sweep (partial shading)</text><path class="w" d="M380,312 C230,330 90,300 90,216" marker-end="url(#ah)"/><text class="m" x="200" y="340" text-anchor="middle">fault clear for 5 s</text><text class="m" x="556" y="300" text-anchor="start">any state -> FAULT on a fault</text><text class="m" x="556" y="316" text-anchor="start">any running state -> INIT if Vin &lt; 11 V (night)</text><text class="m" x="20" y="372" text-anchor="start">Inside TRACK the mode is BUCK if Vout/Vref &lt; 0.97, BOOST if > 1.03, BUCK-BOOST between (1 % hysteresis);</text><text class="m" x="20" y="388" text-anchor="start">the switching frequency comes from a lookup table generated by the loss model (data/fs_lut.json).</text></svg>