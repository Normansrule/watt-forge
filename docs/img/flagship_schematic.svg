<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Flagship reference design: annotated power stage schematic"><title>Flagship reference design: annotated power stage schematic</title>
<style>
  .bg{fill:#fcfcfb} .w{stroke:#52514e;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .c{stroke:#0b0b0b;stroke-width:2.2;fill:none;stroke-linecap:round} .fill{fill:#0b0b0b}
  .t{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0b0b0b}
  .s{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#52514e}
  .m{font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8a8984}
  .ax{stroke:#d8d7d2;stroke-width:1}
  .p1{stroke:#2a78d6} .p2{stroke:#eb6834} .p3{stroke:#1baf7a} .p4{stroke:#e87ba4}
  .cur{stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:4 14}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .wave{stroke-width:2;fill:none} .v{stroke:#2a78d6} .i{stroke:#eb6834}
  .cursor{stroke:#0b0b0b;stroke-width:1.2;opacity:.55}
  .box{fill:#f2f1ed;stroke:#d8d7d2} .hi{fill:#e5efff;stroke:#2a78d6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .w{stroke:#c3c2b7} .c{stroke:#ffffff} .fill{fill:#ffffff}
    .t{fill:#ffffff} .s{fill:#c3c2b7} .m{fill:#8f8e87} .ax{stroke:#3a3a37}
    .p1{stroke:#3987e5} .p2{stroke:#d95926} .p3{stroke:#199e70} .p4{stroke:#d55181}
    .v{stroke:#3987e5} .i{stroke:#d95926} .cursor{stroke:#ffffff}
    .box{fill:#262624;stroke:#3a3a37} .hi{fill:#1f2d44;stroke:#3987e5}
  }
</style>
<rect class="bg" width="980" height="600" rx="10"/><text class="t" x="20" y="28" text-anchor="start">Watt Forge flagship: hybrid three-level GaN buck-boost, 12-60 V panel -> 40-58 V battery, 400 W</text><text class="m" x="20" y="46" text-anchor="start">REFERENCE DESIGN - simulate and review before use. High voltage and stored energy: see SAFETY.md.</text><polyline class="w" points="60,160 60,277.0"/><polyline class="w" points="60,313.0 60,430"/><circle class="c" cx="60" cy="295.0" r="18"/><text class="s" x="60" y="291.0" text-anchor="middle">+</text><text class="s" x="60" y="307.0" text-anchor="middle">&#8722;</text><text class="t" x="30" y="299.0" text-anchor="end">PV</text><polyline class="w" points="60,160 60,120 90,120"/><polyline class="w" points="60,430 60,470"/><rect class="box" x="90" y="102" width="70" height="36" rx="5"/><text class="s" x="125" y="125" text-anchor="middle">Q_IN</text><text class="m" x="125" y="94" text-anchor="middle">BDS INV100FQ030C</text><polyline class="w" points="160,120 190,120"/><rect class="box" x="190" y="110" width="36" height="20" rx="3"/><text class="m" x="208" y="148" text-anchor="middle">RS1 1 mOhm</text><polyline class="w" points="226,120 330,120"/><circle class="fill" cx="250" cy="120" r="3.2"/><polyline class="w" points="250,120 250,291.0"/><polyline class="w" points="250,299.0 250,470"/><line class="c" x1="237" y1="291.0" x2="263" y2="291.0"/><line class="c" x1="237" y1="299.0" x2="263" y2="299.0"/><text class="t" x="242" y="290" text-anchor="end">CIN</text><text class="m" x="242" y="306" text-anchor="end">6x10 uF</text><text class="m" x="242" y="320" text-anchor="end">+ 2x33 uF</text><polyline class="w" points="330,120 380,120"/><rect class="hi" x="364" y="134" width="32" height="42" rx="4"/><polyline class="w" points="380,120 380,134"/><polyline class="w" points="380,176 380,190"/><text class="t" x="356" y="159.0" text-anchor="end">Q1</text><rect class="hi" x="364" y="214" width="32" height="42" rx="4"/><polyline class="w" points="380,200 380,214"/><polyline class="w" points="380,256 380,270"/><text class="t" x="356" y="239.0" text-anchor="end">Q2</text><rect class="hi" x="364" y="304" width="32" height="42" rx="4"/><polyline class="w" points="380,290 380,304"/><polyline class="w" points="380,346 380,360"/><text class="t" x="356" y="329.0" text-anchor="end">Q3</text><rect class="hi" x="364" y="384" width="32" height="72" rx="4"/><polyline class="w" points="380,370 380,384"/><polyline class="w" points="380,456 380,470"/><text class="t" x="356" y="424.0" text-anchor="end">Q4</text><polyline class="w" points="380,190 380,200"/><polyline class="w" points="380,270 380,290"/><polyline class="w" points="380,360 380,370"/><circle class="fill" cx="380" cy="195" r="3.2"/><circle class="fill" cx="380" cy="365" r="3.2"/><polyline class="w" points="380,195 325,195"/><polyline class="w" points="380,365 325,365"/><polyline class="w" points="325,195 325,276.0"/><polyline class="w" points="325,284.0 325,365"/><line class="c" x1="312" y1="276.0" x2="338" y2="276.0"/><line class="c" x1="312" y1="284.0" x2="338" y2="284.0"/><text class="t" x="318" y="265" text-anchor="end">CF1</text><text class="m" x="318" y="316" text-anchor="end">4x10 uF</text><circle class="fill" cx="380" cy="280" r="3.2"/><text class="t" x="388" y="306" text-anchor="start">A</text><polyline class="w" points="380,280 416.0,280"/><polyline class="w" points="584.0,280 620,280"/><path class="c" d="M416.0,280 a21.0,21.0 0 0 1 42.0,0 a21.0,21.0 0 0 1 42.0,0 a21.0,21.0 0 0 1 42.0,0 a21.0,21.0 0 0 1 42.0,0"/><text class="s" x="500.0" y="251.0" text-anchor="middle">L1  SER2918H-472  4.7 uH</text><circle class="fill" cx="620" cy="280" r="3.2"/><rect class="hi" x="604" y="134" width="32" height="42" rx="4"/><polyline class="w" points="620,120 620,134"/><polyline class="w" points="620,176 620,190"/><text class="t" x="644" y="159.0" text-anchor="start">Q5</text><rect class="hi" x="604" y="214" width="32" height="42" rx="4"/><polyline class="w" points="620,200 620,214"/><polyline class="w" points="620,256 620,270"/><text class="t" x="644" y="239.0" text-anchor="start">Q6</text><rect class="hi" x="604" y="304" width="32" height="42" rx="4"/><polyline class="w" points="620,290 620,304"/><polyline class="w" points="620,346 620,360"/><text class="t" x="644" y="329.0" text-anchor="start">Q7</text><rect class="hi" x="604" y="384" width="32" height="72" rx="4"/><polyline class="w" points="620,370 620,384"/><polyline class="w" points="620,456 620,470"/><text class="t" x="644" y="424.0" text-anchor="start">Q8</text><polyline class="w" points="620,190 620,200"/><polyline class="w" points="620,270 620,290"/><polyline class="w" points="620,360 620,370"/><circle class="fill" cx="620" cy="195" r="3.2"/><circle class="fill" cx="620" cy="365" r="3.2"/><polyline class="w" points="620,195 675,195"/><polyline class="w" points="620,365 675,365"/><polyline class="w" points="675,195 675,276.0"/><polyline class="w" points="675,284.0 675,365"/><line class="c" x1="662" y1="276.0" x2="688" y2="276.0"/><line class="c" x1="662" y1="284.0" x2="688" y2="284.0"/><text class="t" x="683" y="265" text-anchor="start">CF2</text><text class="m" x="683" y="316" text-anchor="start">4x10 uF</text><text class="t" x="612" y="306" text-anchor="end">B</text><polyline class="w" points="620,120 760,120"/><circle class="fill" cx="740" cy="120" r="3.2"/><polyline class="w" points="740,120 740,291.0"/><polyline class="w" points="740,299.0 740,470"/><line class="c" x1="727" y1="291.0" x2="753" y2="291.0"/><line class="c" x1="727" y1="299.0" x2="753" y2="299.0"/><text class="t" x="752" y="290" text-anchor="start">COUT</text><rect class="box" x="760" y="110" width="36" height="20" rx="3"/><text class="m" x="778" y="148" text-anchor="middle">RS2 1 mOhm</text><polyline class="w" points="796,120 880,120 880,160"/><rect class="c" x="862" y="160" width="36" height="70" rx="4"/><text class="s" x="880" y="200" text-anchor="middle">BATT</text><text class="m" x="880" y="248" text-anchor="middle">48 V</text><polyline class="w" points="880,230 880,470"/><polyline class="w" points="60,470 880,470"/><line class="c" x1="488" y1="470" x2="512" y2="470"/><line class="c" x1="493" y1="475" x2="507" y2="475"/><line class="c" x1="497" y1="480" x2="503" y2="480"/><polyline class="w" points="300,120 300,80 560,80"/><rect class="box" x="560" y="62" width="80" height="36" rx="5"/><text class="s" x="600" y="85" text-anchor="middle">Q_BP</text><text class="m" x="600" y="56" text-anchor="middle">bypass BDS INV100FQ030C</text><polyline class="w" points="640,80 740,80 740,120"/><circle class="fill" cx="300" cy="120" r="3.2"/><text class="m" x="20" y="510" text-anchor="start">Q1-Q8: EPC2361 100 V GaN, 1.0 mOhm max. Each blocks Vbus/2 in steady state (&lt;= 30 V), full Vbus (60 V) during precharge.</text><text class="m" x="20" y="527" text-anchor="start">Flying caps self-balance at Vin/2 and Vout/2 with 180-degree phase-shifted PWM; node A/B step at 2x the switching frequency.</text><text class="m" x="20" y="544" text-anchor="start">Buck mode: output leg static (Q5,Q6 on). Boost mode: input leg static (Q1,Q2 on). Near Vout = 2 Vin the output leg is a soft-charged 1:2 SC stage.</text><text class="m" x="20" y="561" text-anchor="start">Bypass: when the panel's maximum power point sits within 2 % of the battery, Q_BP ties them together and all eight switches stop.</text><text class="m" x="20" y="578" text-anchor="start">Gate drive: ADuM4121 isolated drivers for the six floating switches, LMG1020 for Q4/Q8; controller STM32G474 (HRTIM, 184 ps).</text></svg>