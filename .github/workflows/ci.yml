name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: System tools (ngspice for cross-checks, Icarus Verilog for the HDL testbench)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice iverilog
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Tests (physics, flagship model vs simulation vs ngspice, C vs Python controller, HDL, site)
        run: python -m pytest
      - name: Generated files are up to date
        run: |
          python -m watt_forge.flagship.design
          python scripts/make_web_data.py
          python scripts/build_site.py
          git diff --exit-code -- data docs/data docs/js/data docs/REFERENCES.md tests/fixtures docs/*.html docs/learn docs/tools docs/sw.js docs/manifest.webmanifest
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Browser model parity with the Python model
        run: node tests/js/parity.mjs
      - name: Browser netlist guard agrees with Python and Rust
        run: node tests/js/guard.mjs
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Netlist guard (desktop sandbox)
        working-directory: desktop/netlist-guard
        run: cargo test --locked
