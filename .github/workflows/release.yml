name: release
# Push a tag like v0.1.0 and this publishes one GitHub release with: the source ZIP, an SPDX SBOM,
# desktop installers for Linux (.deb, .rpm, .AppImage), Windows (.msi, setup .exe) and macOS (.dmg),
# a SHA256SUMS file covering all of them, and Sigstore build-provenance attestations.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Source archive
        run: python scripts/make_zip.py --out dist/watt-forge-${{ github.ref_name }}.zip
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          path: .
          format: spdx-json
          output-file: dist/watt-forge-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/
  publish:
    needs: [desktop, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore signing for build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed build provenance (Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          body: |
            **Web app:** the GitHub Pages site for this repository (installable: use your browser's "Install app" button).
            **Desktop app:** download the installer for your system below. It runs offline and adds a live, sandboxed ngspice runner.
            - Ubuntu/Debian: `sudo apt install ./Watt.Forge_*_amd64.deb` (pulls in ngspice)
            - Other Linux: the `.AppImage` (`chmod +x` it, then run; install ngspice separately for the SPICE runner)
            - Windows: the `.msi` or `-setup.exe` (unsigned: SmartScreen may ask you to confirm; install ngspice and put it on PATH for the SPICE runner)
            - macOS (Apple silicon): the `.dmg` (unsigned: right-click > Open the first time; `brew install ngspice` for the SPICE runner)

            Verify a download: `sha256sum -c SHA256SUMS --ignore-missing` and `gh attestation verify <file> --repo ${{ github.repository }}`.

            Design and simulation reference only: see SAFETY.md before building any hardware.
