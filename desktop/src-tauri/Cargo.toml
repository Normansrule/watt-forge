[package]
name = "watt-forge-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Watt Forge desktop shell (Tauri 2): the same web app offline, plus a sandboxed ngspice back end."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
netlist-guard = { path = "../netlist-guard" }
